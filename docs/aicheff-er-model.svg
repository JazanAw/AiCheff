<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1420" viewBox="0 0 1900 1420">
  <defs>
    <style>
      .bg{fill:#f7f8fa}
      .title{font:700 30px Arial,sans-serif;fill:#172033}
      .subtitle{font:400 15px Arial,sans-serif;fill:#526070}
      .domain{font:700 18px Arial,sans-serif;fill:#172033}
      .box{fill:#fff;stroke:#9aa7b6;stroke-width:1.5;rx:10}
      .box.user{stroke:#2563eb}
      .box.recipe{stroke:#16a34a}
      .box.offer{stroke:#dc2626}
      .box.plan{stroke:#9333ea}
      .box.ops{stroke:#64748b}
      .head{font:700 14px Arial,sans-serif;fill:#111827}
      .cols{font:12px Consolas,monospace;fill:#334155}
      .note{font:12px Arial,sans-serif;fill:#475569}
      .rel{stroke:#64748b;stroke-width:1.4;fill:none;marker-end:url(#arrow)}
      .relstrong{stroke:#0f172a;stroke-width:2;fill:none;marker-end:url(#arrowDark)}
      .dash{stroke-dasharray:7 5}
      .label{font:12px Arial,sans-serif;fill:#334155}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1900" height="1420"/>
  <text class="title" x="40" y="48">AICheff ER-Modell / Persistenzübersicht</text>
  <text class="subtitle" x="40" y="75">Basiert auf Supabase-Migrationen, Backend-Sync und lokalem Offers-Snapshot. Gestrichelte Linien = Sync/abgeleitete Daten, keine harte FK-Beziehung.</text>

  <!-- Domain headers -->
  <text class="domain" x="50" y="125">User, Auth, Billing</text>
  <text class="domain" x="50" y="435">Planung, Einkauf, Pantry, Diet</text>
  <text class="domain" x="690" y="125">Rezepte &amp; Interaktion</text>
  <text class="domain" x="1260" y="125">Angebote, Scans, Historie</text>
  <text class="domain" x="1260" y="960">Admin / Ops</text>

  <!-- User/Auth -->
  <rect class="box user" x="50" y="145" width="250" height="110"/>
  <text class="head" x="70" y="170">auth.users</text>
  <text class="cols" x="70" y="195">id PK</text>
  <text class="cols" x="70" y="215">email</text>
  <text class="note" x="70" y="238">Supabase Auth root</text>

  <rect class="box user" x="340" y="145" width="270" height="140"/>
  <text class="head" x="360" y="170">profiles</text>
  <text class="cols" x="360" y="195">id PK/FK auth.users</text>
  <text class="cols" x="360" y="215">email UK, display_name</text>
  <text class="cols" x="360" y="235">language, country_code</text>
  <text class="cols" x="360" y="255">onboarding, banned</text>

  <rect class="box user" x="50" y="285" width="270" height="130"/>
  <text class="head" x="70" y="310">user_preferences</text>
  <text class="cols" x="70" y="335">user_id PK/FK</text>
  <text class="cols" x="70" y="355">radius, allergies</text>
  <text class="cols" x="70" y="375">halal_filter, hide_alcohol</text>
  <text class="cols" x="70" y="395">postal_code, lat/lng</text>

  <rect class="box user" x="350" y="305" width="260" height="110"/>
  <text class="head" x="370" y="330">subscriptions</text>
  <text class="cols" x="370" y="355">user_id PK/FK</text>
  <text class="cols" x="370" y="375">tier, status</text>
  <text class="cols" x="370" y="395">stripe_customer_id UK</text>

  <rect class="box user" x="50" y="1210" width="270" height="90"/>
  <text class="head" x="70" y="1235">user_push_tokens / admins</text>
  <text class="cols" x="70" y="1260">push_tokens: user_id FK</text>
  <text class="cols" x="70" y="1280">admins: user_id PK/FK</text>

  <!-- Planning/Pantry/Diet -->
  <rect class="box plan" x="50" y="455" width="270" height="120"/>
  <text class="head" x="70" y="480">weekly_plan_entries</text>
  <text class="cols" x="70" y="505">id PK, user_id FK</text>
  <text class="cols" x="70" y="525">recipe_id FK</text>
  <text class="cols" x="70" y="545">week_start, day, meal_type</text>
  <text class="cols" x="70" y="565">UK user/week/day/meal</text>

  <rect class="box plan" x="350" y="455" width="280" height="130"/>
  <text class="head" x="370" y="480">shopping_list_items</text>
  <text class="cols" x="370" y="505">id PK, user_id FK</text>
  <text class="cols" x="370" y="525">name, quantity, unit</text>
  <text class="cols" x="370" y="545">deal_id, recipe_id FK</text>
  <text class="cols" x="370" y="565">pantry_item_id FK</text>

  <rect class="box plan" x="350" y="625" width="280" height="150"/>
  <text class="head" x="370" y="650">pantry_items</text>
  <text class="cols" x="370" y="675">id PK, user_id FK</text>
  <text class="cols" x="370" y="695">shopping_item_id FK</text>
  <text class="cols" x="370" y="715">deal_id FK</text>
  <text class="cols" x="370" y="735">barcode, brand, product_name</text>
  <text class="cols" x="370" y="755">nutrition, raw_product_payload</text>

  <rect class="box plan" x="50" y="625" width="270" height="120"/>
  <text class="head" x="70" y="650">recipe_cooked_log</text>
  <text class="cols" x="70" y="675">id PK, user_id FK</text>
  <text class="cols" x="70" y="695">recipe_id FK</text>
  <text class="cols" x="70" y="715">weekly_plan_entry_id FK</text>
  <text class="cols" x="70" y="735">cooked_at, rating</text>

  <rect class="box plan" x="50" y="805" width="270" height="120"/>
  <text class="head" x="70" y="830">user_body_data</text>
  <text class="cols" x="70" y="855">user_id PK/FK</text>
  <text class="cols" x="70" y="875">weight, height, activity</text>
  <text class="cols" x="70" y="895">diet_goal_type</text>
  <text class="cols" x="70" y="915">calorie/protein/water targets</text>

  <rect class="box plan" x="350" y="805" width="280" height="120"/>
  <text class="head" x="370" y="830">diet logs</text>
  <text class="cols" x="370" y="855">user_progress_entries</text>
  <text class="cols" x="370" y="875">user_meal_log (recipe_id FK)</text>
  <text class="cols" x="370" y="895">user_water_log PK(user,day)</text>
  <text class="cols" x="370" y="915">entry_date + nutrition</text>

  <!-- Recipes -->
  <rect class="box recipe" x="690" y="145" width="310" height="170"/>
  <text class="head" x="710" y="170">recipes</text>
  <text class="cols" x="710" y="195">id PK</text>
  <text class="cols" x="710" y="215">name jsonb, meal_type</text>
  <text class="cols" x="710" y="235">category, difficulty, status</text>
  <text class="cols" x="710" y="255">nutrition, rating counters</text>
  <text class="cols" x="710" y="275">source_type, verification_status</text>
  <text class="cols" x="710" y="295">tags, diet_flags, halal_status</text>

  <rect class="box recipe" x="1040" y="145" width="270" height="120"/>
  <text class="head" x="1060" y="170">recipe_ingredients</text>
  <text class="cols" x="1060" y="195">id PK, recipe_id FK</text>
  <text class="cols" x="1060" y="215">position UK per recipe</text>
  <text class="cols" x="1060" y="235">name jsonb, amount, unit</text>
  <text class="cols" x="1060" y="255">allergens, halal flags</text>

  <rect class="box recipe" x="1040" y="295" width="270" height="100"/>
  <text class="head" x="1060" y="320">recipe_instructions</text>
  <text class="cols" x="1060" y="345">id PK, recipe_id FK</text>
  <text class="cols" x="1060" y="365">step_number UK</text>
  <text class="cols" x="1060" y="385">text jsonb</text>

  <rect class="box recipe" x="690" y="355" width="310" height="120"/>
  <text class="head" x="710" y="380">recipe_swipes / comments</text>
  <text class="cols" x="710" y="405">swipes: user_id, recipe_id</text>
  <text class="cols" x="710" y="425">action, week_start_date</text>
  <text class="cols" x="710" y="445">comments: rating, text, photo</text>

  <!-- Offers -->
  <rect class="box offer" x="1260" y="145" width="300" height="160"/>
  <text class="head" x="1280" y="170">backend/data/offers.json</text>
  <text class="cols" x="1280" y="195">offers[] current snapshot</text>
  <text class="cols" x="1280" y="215">nextWeekOffers[]</text>
  <text class="cols" x="1280" y="235">filteredOffers[]</text>
  <text class="cols" x="1280" y="255">offerScopes, warnings</text>
  <text class="note" x="1280" y="282">Local JSON, not Supabase table</text>

  <rect class="box offer" x="1600" y="145" width="260" height="170"/>
  <text class="head" x="1620" y="170">deals</text>
  <text class="cols" x="1620" y="195">id PK</text>
  <text class="cols" x="1620" y="215">source + external_id UK</text>
  <text class="cols" x="1620" y="235">name, store_name</text>
  <text class="cols" x="1620" y="255">current_price, valid_from/to</text>
  <text class="cols" x="1620" y="275">is_food, nutrition, raw_payload</text>

  <rect class="box offer" x="1600" y="360" width="260" height="110"/>
  <text class="head" x="1620" y="385">deal_recipe_matches</text>
  <text class="cols" x="1620" y="410">id PK</text>
  <text class="cols" x="1620" y="430">deal_id FK</text>
  <text class="cols" x="1620" y="450">recipe_ingredient_id FK</text>

  <rect class="box offer" x="1260" y="360" width="300" height="120"/>
  <text class="head" x="1280" y="385">deal_favorites</text>
  <text class="cols" x="1280" y="410">PK user_id + deal_id(text)</text>
  <text class="cols" x="1280" y="430">snapshot: name/store/price</text>
  <text class="note" x="1280" y="455">No FK to deals: backend offer ids rotate</text>

  <rect class="box offer" x="1260" y="540" width="300" height="145"/>
  <text class="head" x="1280" y="565">offer_scan_runs</text>
  <text class="cols" x="1280" y="590">id PK</text>
  <text class="cols" x="1280" y="610">snapshot_id UK</text>
  <text class="cols" x="1280" y="630">scan_type, status</text>
  <text class="cols" x="1280" y="650">iso_year, iso_week</text>
  <text class="cols" x="1280" y="670">offers/history counters</text>

  <rect class="box offer" x="1600" y="540" width="260" height="185"/>
  <text class="head" x="1620" y="565">offer_history</text>
  <text class="cols" x="1620" y="590">id PK</text>
  <text class="cols" x="1620" y="610">scan_run_id FK</text>
  <text class="cols" x="1620" y="630">snapshot_id</text>
  <text class="cols" x="1620" y="650">source + external_id</text>
  <text class="cols" x="1620" y="670">canonical_product_key</text>
  <text class="cols" x="1620" y="690">store/product/price</text>
  <text class="cols" x="1620" y="710">valid_from/until</text>

  <rect class="box offer" x="1260" y="760" width="300" height="95"/>
  <text class="head" x="1280" y="785">deal_scans</text>
  <text class="cols" x="1280" y="810">id PK, triggered_by FK</text>
  <text class="cols" x="1280" y="830">trigger, status, counts</text>
  <text class="note" x="1280" y="848">Legacy scan log</text>

  <!-- Ops -->
  <rect class="box ops" x="1260" y="980" width="300" height="130"/>
  <text class="head" x="1280" y="1005">admin / config / jobs</text>
  <text class="cols" x="1280" y="1030">activity_log</text>
  <text class="cols" x="1280" y="1050">push_history</text>
  <text class="cols" x="1280" y="1070">feature_flags, app_config</text>
  <text class="cols" x="1280" y="1090">app_secrets, ai_training_runs</text>

  <rect class="box ops" x="1600" y="980" width="260" height="110"/>
  <text class="head" x="1620" y="1005">billing / imports</text>
  <text class="cols" x="1620" y="1030">stripe_events</text>
  <text class="cols" x="1620" y="1050">cookbook_uploads</text>
  <text class="cols" x="1620" y="1070">saved_recipe_id FK</text>

  <!-- Relationships -->
  <path class="relstrong" d="M300 200 C315 200 325 200 340 200"/>
  <path class="relstrong" d="M180 255 C180 270 180 275 180 285"/>
  <path class="relstrong" d="M300 235 C340 245 365 275 395 305"/>
  <path class="rel" d="M185 415 C185 430 185 440 185 455"/>
  <path class="rel" d="M255 415 C300 430 385 435 430 455"/>
  <path class="rel" d="M320 350 C540 420 620 550 690 420"/>
  <path class="rel" d="M185 415 C160 530 160 700 185 805"/>
  <path class="rel" d="M300 200 C565 175 625 190 690 210"/>

  <path class="relstrong" d="M1000 205 C1015 205 1025 205 1040 205"/>
  <path class="relstrong" d="M1000 260 C1020 290 1025 330 1040 345"/>
  <path class="rel" d="M845 315 C845 335 845 345 845 355"/>
  <path class="rel" d="M845 315 C730 430 285 480 185 455"/>
  <path class="rel" d="M845 315 C740 555 275 610 185 625"/>
  <path class="rel" d="M845 315 C720 455 590 510 490 520"/>

  <path class="relstrong dash" d="M1560 220 C1575 220 1585 220 1600 220"/>
  <text class="label" x="1482" y="210">sync upsert</text>
  <path class="relstrong dash" d="M1560 265 C1590 375 1610 500 1660 540"/>
  <text class="label" x="1495" y="335">history write</text>
  <path class="relstrong" d="M1560 610 C1575 610 1585 610 1600 610"/>
  <path class="rel" d="M1730 315 C1730 335 1730 345 1730 360"/>
  <path class="rel" d="M1600 415 C1460 420 1420 405 1560 240"/>
  <path class="rel" d="M1600 430 C1400 430 1305 230 1310 210"/>
  <path class="rel" d="M1040 205 C1320 310 1430 360 1600 430"/>
  <path class="rel" d="M1600 245 C1320 330 595 455 490 455"/>
  <path class="rel" d="M1600 255 C1300 455 690 650 630 690"/>

  <path class="rel" d="M490 585 C490 600 490 610 490 625"/>
  <path class="rel" d="M350 690 C335 690 325 690 320 690"/>
  <path class="rel" d="M320 515 C335 515 345 515 350 515"/>
  <path class="rel" d="M320 685 C335 685 345 685 350 685"/>
  <path class="rel" d="M185 575 C185 595 185 610 185 625"/>
  <path class="rel" d="M320 865 C335 865 345 865 350 865"/>

  <path class="rel" d="M1410 855 C1410 905 1410 940 1410 980"/>
  <path class="rel" d="M1560 1035 C1575 1035 1585 1035 1600 1035"/>
  <path class="rel" d="M1000 250 C1240 820 1450 960 1600 1035"/>

  <!-- Legend -->
  <rect class="box" x="50" y="1330" width="1810" height="60"/>
  <text class="head" x="70" y="1355">Legende</text>
  <text class="note" x="150" y="1355">Blaue Boxen: User/Auth/Billing · Grüne Boxen: Rezepte · Rote Boxen: Angebote/History · Violette Boxen: Planung/Pantry/Diet · Graue Boxen: Admin/Ops</text>
  <text class="note" x="150" y="1378">Durchgezogene Linien: FK oder starke Domain-Beziehung. Gestrichelte Linien: Backend-Sync aus lokalem JSON-Snapshot nach Supabase.</text>
</svg>
